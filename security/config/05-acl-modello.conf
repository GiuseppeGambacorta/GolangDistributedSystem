# Request definition: cosa arriva da controllare (chi sei, su cosa, che azione).
# Nota su obj: al momento c'è un solo commit log, quindi non facciamo controlli su oggetti
# specifici e passiamo sempre "*". Tenere obj nel modello ci lascia pronti per futuri topic multipli.
[request_definition]
r = sub, obj, act

# Policy definition: formato di ogni riga nel file 06-acl-permessi.csv
[policy_definition]
p = sub, obj, act

# Policy effect: decide l'esito finale dopo aver confrontato la richiesta con TUTTE le righe del CSV.
# - Ogni riga in 06-acl-permessi.csv ha implicitamente effetto "allow" (p.eft == allow).
# - "some(...)" significa: basta che ALMENO UNA riga combaci con effetto allow per autorizzare;
#   se nessuna riga combacia, la richiesta viene negata automaticamente (default-deny).
[policy_effect]
e = some(where (p.eft == allow))

# Matchers: condizione booleana valutata riga per riga tra richiesta (r) e regola nel CSV (p).
# Esempi con il nostro 06-acl-permessi.csv:
#   1) r = ("reader", "*", "consume")   vs  p = ("reader", "*", "consume") -> TRUE  (autorizzato)
#   2) r = ("reader", "*", "produce")   vs  tutte le righe del CSV         -> FALSE (PermissionDenied)
#   3) r = ("root", "log-1", "produce") vs  p = ("root", "*", "produce")   -> TRUE  (grazie a p.obj == "*")
[matchers]
m = r.sub == p.sub && (r.obj == p.obj || p.obj == "*") && r.act == p.act
